services:
  typesense:
    image: typesense/typesense:31
    restart: unless-stopped
    networks:
      - app-internal
    volumes:
      - typesense-data:/data
    env_file:
    - ./typesense/.env
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=${TYPESENSE_ENABLE_CORS:-false}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"ok\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    profiles: ["prod"]
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-internal
    env_file:
      - ./portal/.env   # just the secret: search-only TYPESENSE_API_KEY
    environment:
      # Topology, not secret — hardcoded here because it's determined by
      # this compose file's network, not by any .env.
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      - TYPESENSE_PATH=
    depends_on:
      typesense:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  tools:
    profiles: ["tools"]
    build:
      context: ./typesense
    networks:
      - app-internal
    env_file:
      - ./typesense/.env
    environment:
      - DATAVERSE_BASE=https://ssh.datastations.nl
    volumes:
      - ./typesense:/app

networks:
  app-internal:
    driver: bridge

volumes:
  typesense-data: